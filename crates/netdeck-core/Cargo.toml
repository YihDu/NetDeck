[package]
name = "netdeck-core"
version = "0.2.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
chrono = { version = "0.4", features = ["serde"] }
ipnet = "2"
url = "2"
regex = "1"
dirs = "6"
tempfile = "3"
glob = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks"] }

shell-words = "1"

libc = "0.2"
